services:
  postgres:
    image: postgres:16-alpine
    container_name: meu-projeto-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: meu_projeto
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: meu-projeto-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/meu_projeto?schema=public
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      - postgres


volumes:
  postgres_data:
